name: nginx-http-starter
description: Minimal production-ready NGINX static HTTP server with modular config and clean structure.
version: 1.0.0

category: backend

tags:
  - nginx
  - http
  - static
  - starter
  - boilerplate
  - web-server

files:
  include:
    - nginx.conf
    - conf.d/
    - public/
    - mime.types

scaffold:
  commands: []

run:
  command: nginx -c nginx.conf -p .

ports:
  - 8080

entry:
  path: public/index.html

author:
  name: kikplate starter

license: Apache 2.0